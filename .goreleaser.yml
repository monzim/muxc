version: 2

project_name: muxc

before:
  hooks:
    - go mod tidy

builds:
  - id: muxc
    main: ./cmd/muxc
    binary: muxc
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}

archives:
  - id: muxc
    builds:
      - muxc
    name_template: "muxc_{{.Version}}_{{.Os}}_{{.Arch}}"
    format: tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "muxc_{{.Version}}_checksums.txt"
  algorithm: sha256

release:
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
