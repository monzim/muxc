run:
  timeout: 5m
  # Target the Go language version from go.mod's `go` directive, not the
  # newer `toolchain` directive. Without this pin, golangci-lint (which is
  # itself built with Go 1.24) refuses to load when it sees toolchain
  # go1.26.3 in go.mod with: "the Go language version used to build
  # golangci-lint is lower than the targeted Go version".
  go: "1.24"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - gocritic
    - revive
    - gosec

linters-settings:
  goimports:
    local-prefixes: github.com/monzim/muxc
  revive:
    rules:
      - name: exported
        severity: warning
  gocritic:
    # hugeParam is already disabled by default; listing it here triggers a
    # noisy "no need to disable" warning. Re-add named checks here if any
    # default gocritic check needs silencing.
    disabled-checks: []
  gosec:
    excludes:
      - G204  # subprocess launched with variable — expected for tmux exec wrappers

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - gosec
        - errcheck
        # Test helpers (fakeAttacher, captureTable, etc.) may sit unused
        # between test runs — keep them rather than churn the file.
        - unused
  max-issues-per-linter: 0
  max-same-issues: 0
