run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - gocritic
    - revive
    - gosec

linters-settings:
  goimports:
    local-prefixes: github.com/monzim/muxc
  revive:
    rules:
      - name: exported
        severity: warning
  gocritic:
    disabled-checks:
      - hugeParam
  gosec:
    excludes:
      - G204  # subprocess launched with variable — expected for tmux exec wrappers

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
